name: CI

on:
  push:
    branches: [main]
    paths-ignore: [docs/decisions.md]
  pull_request:
    paths-ignore: [docs/decisions.md]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the jobs when this change of the pull request already passed (.github/actions/passed-patch)
  gate:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.passed.outputs.key }}
      skip: ${{ steps.passed.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: passed
        uses: ./.github/actions/passed-patch
        with:
          workflow: ci

  check:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Script tests
        run: npm run test:scripts

      - name: Build
        run: npm run build

  remember:
    needs: [gate, check]
    if: needs.gate.outputs.key != '' && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: touch .passed-patch

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .passed-patch
          key: ${{ needs.gate.outputs.key }}
