# End to end tests: builds the Docker image of the app once, then each suite starts its e2e
# backend (tmail-backend + nginx, compose project `twakemail-e2e`) with the image, runs
# Playwright and publishes its report. The suite thus runs against the production image: its
# nginx, cache policy and security headers (a Content-Security-Policy violation fails the test).
#
# Suites (E2E_SUITE, e2e/support/suites.ts), one job each, so that none skips a spec:
#   main       basic auth, the image behind the stack's nginx (start.sh)
#   oidc       the same with Dex and the app in OIDC mode: Drive picker, INFRA OIDC
#   chart      the image started as the Helm chart of tmail-frontend does (start-chart.sh)
#   chart-sso  the same, the stack answering WebFinger with Dex
#
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write # dorny/test-reporter

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/private/Dockerfile
          build-args: BUILD_VERSION=e2e-${{ github.sha }}
          tags: twake-mail-frontend:e2e
          outputs: type=docker,dest=${{ runner.temp }}/app-image.tar
          cache-from: type=gha,scope=twake-mail-frontend
          cache-to: type=gha,mode=max,scope=twake-mail-frontend

      - name: Hand the image to the suites
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}/app-image.tar
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.suite }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image is proxied by the stack's nginx on http://127.0.0.1:18302, which also
          # proxies /jmap (and /dex) on the same origin. Its runtime configuration (/.env.js)
          # is e2e/docker/app-env.js (basic auth) or app-env-oidc.js, served by that nginx.
          - suite: main
            start: ./e2e/scripts/start.sh
            oidc: '0'
            app-image: twake-mail-frontend:e2e
            app-env: ''
            chart-image: ''
          - suite: oidc
            start: ./e2e/scripts/start.sh
            oidc: '1'
            app-image: twake-mail-frontend:e2e
            app-env: e2e/docker/app-env-oidc.js
            chart-image: ''
          # The image serves its own /.env.js, derived from the env.file of the chart
          - suite: chart
            start: ./e2e/scripts/start-chart.sh
            oidc: '0'
            app-image: ''
            app-env: ''
            chart-image: twake-mail-frontend:e2e
          - suite: chart-sso
            start: ./e2e/scripts/start-chart.sh
            oidc: '1'
            app-image: ''
            app-env: ''
            chart-image: twake-mail-frontend:e2e
    env:
      CI: 'true'
      E2E_SUITE: ${{ matrix.suite }}
      E2E_OIDC: ${{ matrix.oidc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # ------------------------------------------------------------------ app
      - name: Download the app image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}

      - name: Load the app image
        run: docker load --input "$RUNNER_TEMP/app-image.tar"

      # -------------------------------------------------------------- backend
      - name: Pull backend images
        run: docker compose -p twakemail-e2e -f e2e/docker/docker-compose.yaml --profile oidc pull --quiet

      - name: Start the e2e stack
        run: ${{ matrix.start }}
        env:
          E2E_APP_IMAGE: ${{ matrix.app-image }}
          E2E_APP_ENV: ${{ matrix.app-env }}
          E2E_CHART_IMAGE: ${{ matrix.chart-image }}

      # ------------------------------------------------------------ playwright
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck the suite
        if: matrix.suite == 'main'
        working-directory: e2e
        run: npm run typecheck

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      # --------------------------------------------------------------- report
      - name: Backend logs
        if: failure()
        run: docker compose -p twakemail-e2e -f e2e/docker/docker-compose.yaml -f e2e/docker/docker-compose.image.yaml --profile oidc logs --no-color > e2e/test-results/backend.log 2>&1 || true

      - name: Publish the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Publish traces, videos and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.suite }}
          path: e2e/test-results/
          retention-days: 14

      - name: Test summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: E2E results (${{ matrix.suite }})
          path: e2e/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Stop the e2e stack
        if: always()
        run: ./e2e/scripts/stop.sh
