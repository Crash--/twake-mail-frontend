# End to end tests: builds the Docker image of the app, starts the e2e backend (tmail-backend +
# nginx, compose project `twakemail-e2e`) with the image behind its nginx, runs Playwright
# and publishes the report. The suite thus runs against the production image: its nginx,
# cache policy and security headers (a Content-Security-Policy violation fails the test).
#
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      oidc:
        description: Also start Dex and run the OIDC specs
        type: boolean
        default: false

permissions:
  contents: read
  checks: write # dorny/test-reporter

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      E2E_OIDC: ${{ inputs.oidc && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # ------------------------------------------------------------------ app
      - uses: docker/setup-buildx-action@v4

      # The image is proxied by the stack's nginx on http://127.0.0.1:18302, which also proxies
      # /jmap (and /dex) on the same origin. Its runtime configuration (/.env.js: basic auth,
      # JMAP on the app origin) is e2e/docker/app-env.js, served by that nginx.
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/private/Dockerfile
          build-args: BUILD_VERSION=e2e-${{ github.sha }}
          tags: twake-mail-frontend:e2e
          load: true
          cache-from: type=gha,scope=twake-mail-frontend
          cache-to: type=gha,mode=max,scope=twake-mail-frontend

      # -------------------------------------------------------------- backend
      - name: Pull backend images
        run: docker compose -p twakemail-e2e -f e2e/docker/docker-compose.yaml --profile oidc pull --quiet

      - name: Start the e2e stack
        run: ./e2e/scripts/start.sh
        env:
          E2E_APP_IMAGE: twake-mail-frontend:e2e

      # ------------------------------------------------------------ playwright
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck the suite
        working-directory: e2e
        run: npm run typecheck

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      # --------------------------------------------------------------- report
      - name: Backend logs
        if: failure()
        run: docker compose -p twakemail-e2e -f e2e/docker/docker-compose.yaml -f e2e/docker/docker-compose.image.yaml --profile oidc logs --no-color > e2e/test-results/backend.log 2>&1 || true

      - name: Publish the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Publish traces, videos and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Test summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: E2E results
          path: e2e/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Stop the e2e stack
        if: always()
        run: ./e2e/scripts/stop.sh
