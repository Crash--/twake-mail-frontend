name: Publish manifest

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    uses: linagora/twake-workflows/.github/workflows/publish-manifest.yml@c6f6a4de61671a4e5d440d138c5544e4233b58c7 # v1.7.0
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      DOWNCLOUD_SSH_KEY: ${{ secrets.DOWNCLOUD_SSH_KEY }}
