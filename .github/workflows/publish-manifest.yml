name: Publish manifest

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    uses: linagora/twake-workflows/.github/workflows/publish-manifest.yml@7326a5a8138df3df8548f0b0500ffc12b113788b # v1.6.0
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      DOWNCLOUD_SSH_KEY: ${{ secrets.DOWNCLOUD_SSH_KEY }}
