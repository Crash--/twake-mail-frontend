# One origin for the browser: the app and tmail-backend share http://localhost:8080, so no
# CORS and the default Content-Security-Policy of the app is enough. tmail-backend builds
# the URLs of its JMAP session from the X-JMAP-PREFIX headers
# (dynamic.jmap.prefix.resolution.enabled in tmail-backend/jmap.properties).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location ~ ^/(jmap|upload|download|downloadAll|eventSource)(/|$) {
        proxy_set_header X-JMAP-PREFIX $scheme://$http_host;
        proxy_set_header X-JMAP-WEBSOCKET-PREFIX ws://$http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://tmail-backend:80;
    }

    location = /.well-known/jmap {
        proxy_set_header X-JMAP-PREFIX $scheme://$http_host;
        proxy_set_header X-JMAP-WEBSOCKET-PREFIX ws://$http_host;
        proxy_pass http://tmail-backend:80;
    }

    location / {
        proxy_pass http://web:8080;
    }
}
