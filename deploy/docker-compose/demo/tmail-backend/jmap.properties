# JMAP configuration of the demo tmail-backend (memory image), after the one of the
# end-to-end tests (e2e/docker/james/jmap.properties.template).
# Read https://james.apache.org/server/config-jmap.html for further details
enabled=true

tls.keystoreURL=file://conf/keystore
tls.secret=james72laBalle

# Generated by the jwt-keys service of docker-compose.yaml
jwt.publickeypem.url=file://conf/jwt/jwt_publickey
jwt.privatekeypem.url=file://conf/jwt/jwt_privatekey

# The memory image enables the email query view without filling it: Email/query would
# return nothing (see e2e/README.md, "Known backend quirks")
view.email.query.enabled=false

calendarEvent.reply.mailTemplateLocation=file://eml-template/
calendarEvent.reply.supportedLanguages=en,fr

# Basic authentication for the app, tickets for the push WebSocket
authentication.strategy.rfc8621=BasicAuthenticationStrategy,com.linagora.tmail.james.jmap.ticket.TicketAuthenticationStrategy

# The URLs of the JMAP session follow the origin the browser uses (X-JMAP-PREFIX and
# X-JMAP-WEBSOCKET-PREFIX, set by nginx.conf)
url.prefix=http://localhost:8080
websocket.url.prefix=ws://localhost:8080
dynamic.jmap.prefix.resolution.enabled=true
