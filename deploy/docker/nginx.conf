# nginx configuration of the Twake Mail image (nginxinc/nginx-unprivileged).
#
# nginx runs as an unprivileged user (uid 101) on port 8080 and writes nothing
# outside /tmp: the container works with a read-only root filesystem, /tmp
# being a tmpfs (Docker) or an emptyDir (Kubernetes).
#
# /tmp/nginx/conf.d/*.conf is generated at startup by
# /docker-entrypoint.d/40-twake-mail-runtime.sh (cache policy and security
# headers): start the container through the image entrypoint.

worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # The URLs of the application can carry credentials: the OIDC code and
    # state of the login callback, the tokens of an implicit or logout
    # redirect, the WebSocket ticket. Mask them before logging the request
    # line and the Referer.
    # Each pass masks the last sensitive parameter not masked yet, hence the chain.
    map $request_uri $log_uri_1 {
        "~*^(?<lu1_a>.*[?&](?:code|state|session_state|ticket|access_token|id_token|id_token_hint|refresh_token|login_hint|email)=)(?!\[Filtered\])[^&]*(?<lu1_b>.*)$" "${lu1_a}[Filtered]${lu1_b}";
        default $request_uri;
    }

    map $log_uri_1 $log_uri_2 {
        "~*^(?<lu2_a>.*[?&](?:code|state|session_state|ticket|access_token|id_token|id_token_hint|refresh_token|login_hint|email)=)(?!\[Filtered\])[^&]*(?<lu2_b>.*)$" "${lu2_a}[Filtered]${lu2_b}";
        default $log_uri_1;
    }

    map $log_uri_2 $log_uri_3 {
        "~*^(?<lu3_a>.*[?&](?:code|state|session_state|ticket|access_token|id_token|id_token_hint|refresh_token|login_hint|email)=)(?!\[Filtered\])[^&]*(?<lu3_b>.*)$" "${lu3_a}[Filtered]${lu3_b}";
        default $log_uri_2;
    }

    map $log_uri_3 $log_uri {
        "~*^(?<lu4_a>.*[?&](?:code|state|session_state|ticket|access_token|id_token|id_token_hint|refresh_token|login_hint|email)=)(?!\[Filtered\])[^&]*(?<lu4_b>.*)$" "${lu4_a}[Filtered]${lu4_b}";
        default $log_uri_3;
    }

    # The Referer is the page the request comes from: drop its query string
    # and fragment.
    map $http_referer $log_referer {
        "~^(?<lr_p>[^?#]*)[?#]" "${lr_p}?[Filtered]";
        default $http_referer;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                      '$status $body_bytes_sent "$log_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile        on;

    keepalive_timeout  65;
    etag on;

    # Generated at startup: $static_cache_control and $html_cache_control
    # (cache_env.conf), the values of the security headers
    # (security_headers.conf)
    include /tmp/nginx/conf.d/*.conf;

    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.1;

    server {
      listen 8080;

      root /usr/share/nginx/html;

      # Behind a reverse proxy or an ingress, the redirections nginx makes
      # itself (directory without trailing slash) must not carry its own
      # port: relative Location headers.
      absolute_redirect off;

      # Liveness and readiness probe: answers as soon as nginx serves
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      # An add_header in a location drops every add_header inherited from the
      # server: each location includes the security headers itself.
      location / {
        index  index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $html_cache_control always;
        include /etc/nginx/twake-mail/security-headers.conf;
      }

      # Runtime configuration: never cached, so that a change is picked up on
      # the next page load.
      location ~ ^/(\.env|appList|version)\.js$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        include /etc/nginx/twake-mail/security-headers.conf;
      }

      # Static assets (JS, CSS, images, fonts) can be cached forever because they contain content hashes
      location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|svgz|webp|woff|woff2|ttf)$ {
        add_header Cache-Control $static_cache_control;
        include /etc/nginx/twake-mail/security-headers.conf;
        access_log off;
      }

      error_page   500 502 503 504  /50x.html;

      location = /50x.html {
        include /etc/nginx/twake-mail/security-headers.conf;
      }
    }
}
