# Security headers of every response, included by each location of nginx.conf.
# Their values are set at startup from the environment by
# /docker-entrypoint.d/40-twake-mail-runtime.sh (/tmp/nginx/conf.d/security_headers.conf).
# nginx omits a header whose value is empty: only one of the two CSP headers
# is sent, depending on CSP_REPORT_ONLY.
add_header Content-Security-Policy $twake_mail_csp always;
add_header Content-Security-Policy-Report-Only $twake_mail_csp_report_only always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $twake_mail_referrer_policy always;
add_header Permissions-Policy $twake_mail_permissions_policy always;
