# Every optional feature on: rendered and validated by the CI (helm template + kubeconform)
deployment:
  image:
    tag: main
  podAnnotations:
    example.com/team: mail
  extraEnv:
    - name: NGINX_ENTRYPOINT_QUIET_LOGS
      value: "1"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: twake-mail-frontend
config:
  serverUrl: /
  authMode: oidc
  sso:
    baseUrl: https://sso.example.com/
    clientId: twake-mail
    scope: openid,profile,email,offline_access
  domainRedirectUrl: https://mail.example.com
  sentry:
    dsn: https://public@sentry.example.com/42
    environment: ci
    feedbackEnabled: true
  lang: fr
  calendarSpaUrl: https://calendar.example.com
  chatSpaUrl: https://{workplaceFqdn.localpart}-chat.{workplaceFqdn.domain}/
  workplaceFqdnFallback: "{localpart}.workplace.example.com"
  workplaceEmbedding: true
  twakeSpaceUrl: https://space.example.com
  forwardWarningMessage: Do not forward "outside" <example.com>
  tdrive:
    enabled: true
    intentUrl: https://{workplaceFqdn}
  extraEnvJs: |
    var SOME_FUTURE_SETTING = 'value'
csp:
  connectSrc:
    - https://*.workplace.example.com
  frameSrc:
    - https://*.workplace.example.com
  frameAncestors:
    - "'self'"
    - https://*.workplace.example.com
  reportUri: https://sentry.example.com/api/42/security/?sentry_key=public
  reportOnly: true
referrerPolicy: strict-origin-when-cross-origin
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: mail.example.com
  tls:
    enabled: true
  jmap:
    enabled: true
autoscaling:
  enabled: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1
