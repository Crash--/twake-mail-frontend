# Layered on docker-compose.yaml by scripts/spike.sh (compose project twakemail-spike):
# tmail-flutter web, to check how it renders the emails the React composer sends.
#
#   127.0.0.1:18503  linagora/tmail-web, talking to James directly on 127.0.0.1:18500
services:
  tmail-web:
    image: linagora/tmail-web:v0.39.0
    volumes:
      - ./spike/tmail-web.env:/usr/share/nginx/html/assets/env.file:ro
    ports:
      - '127.0.0.1:18503:80'
