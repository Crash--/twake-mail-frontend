# Backend of the Twake Mail e2e suite. Start it with e2e/scripts/start.sh, not by hand:
# the script renders the files of .generated/ (JMAP config, JWT keys, Dex config) first.
#
# Every port is bound to 127.0.0.1 only.
#
#   127.0.0.1:18300  JMAP, straight to tmail-backend (provisioning from the tests)
#   127.0.0.1:18301  WebAdmin (users, domains, quotas, team mailboxes)
#   127.0.0.1:18302  the browser facing origin: the app under test + /jmap + /dex (nginx)
name: twakemail-e2e

services:
  james:
    image: linagora/tmail-backend:memory-1.0.21.2
    # Copied from tmail-flutter backend-docker/, see e2e/docker/james/
    volumes:
      - ./.generated/jwt_publickey:/root/conf/jwt_publickey:ro
      - ./.generated/jwt_privatekey:/root/conf/jwt_privatekey:ro
      - ./.generated/jmap.properties:/root/conf/jmap.properties:ro
      - ./james/mailetcontainer.xml:/root/conf/mailetcontainer.xml:ro
      - ./james/imapserver.xml:/root/conf/imapserver.xml:ro
      - ./james/deletedMessageVault.properties:/root/conf/deletedMessageVault.properties:ro
      - ./james/listeners.xml:/root/conf/listeners.xml:ro
      - ./james/linagora-ecosystem.properties:/root/conf/linagora-ecosystem.properties:ro
      - ./james/openpaas.properties:/root/conf/openpaas.properties:ro
    environment:
      - DOMAIN=example.com
    ports:
      - '127.0.0.1:${E2E_JMAP_PORT:-18300}:80'
      - '127.0.0.1:${E2E_WEBADMIN_PORT:-18301}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          '-o',
          '/dev/null',
          'http://localhost:8000/healthcheck'
        ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/app-dist.conf:/etc/nginx/e2e/app.conf:ro
      - ${E2E_APP_ENV:-./app-env.js}:/etc/nginx/e2e/app-env.js:ro
      - ./app-list.js:/etc/nginx/e2e/app-list.js:ro
      - ${E2E_APP_DIR:-./app-placeholder}:/usr/share/nginx/html:ro
    ports:
      - '127.0.0.1:${E2E_APP_PORT:-18302}:80'
    depends_on:
      - james

  dex:
    profiles: ['oidc']
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    volumes:
      - ./.generated/dex-config.yaml:/etc/dex/config.yaml:ro
