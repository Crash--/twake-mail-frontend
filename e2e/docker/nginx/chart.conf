# Single origin for the browser, in front of the Docker image of the app started as the
# Helm chart of Linagora's tmail-frontend starts tmail-flutter's image
# (docker-compose.chart.yaml, scripts/start-chart.sh): env.file and app_dashboard.json
# mounted in the image, port 80. Unlike default.conf, /.env.js is the image's own.
#
#   /                      the image of the app
#   /.well-known/webfinger the answer written by start-chart.sh (the issuer is Dex, or 404)
#   /jmap, /upload/, ...   tmail-backend
#   /dex/                  Dex, only when the `oidc` profile runs

resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    set $james "james:80";
    set $dex "dex:5556";
    set $app "app:80";

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;

    location ~ ^/(jmap|upload|download|eventSource|publicAsset)(/|$) {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass http://$james$request_uri;
    }

    location = /.well-known/webfinger {
        include /etc/nginx/e2e/webfinger.conf;
    }

    location /.well-known/ {
        proxy_pass http://$james$request_uri;
    }

    location /dex/ {
        proxy_pass http://$dex$request_uri;
    }

    location = /__e2e/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://$app$request_uri;
    }
}
