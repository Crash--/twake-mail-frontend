# Single origin for the browser: the SPA and the backend share http://127.0.0.1:18302.
#
#   /                  the built React app (E2E_APP_DIR mounted on /usr/share/nginx/html),
#                      unknown paths fall back to index.html (client side routing)
#   /jmap, /upload/, /download/, /eventSource, /.well-known/...   tmail-backend (JMAP + websocket)
#   /dex/              Dex, only when the `oidc` profile runs (502 otherwise)
#
# Same origin means no CORS at all in the browser. tmail-backend does answer CORS itself
# (Access-Control-Allow-Origin: *), so a cross origin setup works too, but it is not what
# the suite exercises by default.

# Upstreams are resolved per request: nginx boots even when Dex is not part of the stack.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    set $james "james:80";
    set $dex "dex:5556";

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;

    location ~ ^/(jmap|upload|download|eventSource|publicAsset)(/|$) {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass http://$james$request_uri;
    }

    location /.well-known/ {
        proxy_pass http://$james$request_uri;
    }

    location /dex/ {
        proxy_pass http://$dex$request_uri;
    }

    # Health probe used by start.sh and the Playwright globalSetup
    location = /__e2e/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # never cache the bundle under test
        add_header Cache-Control "no-store" always;
    }
}
