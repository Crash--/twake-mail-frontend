# Single origin for the browser: the SPA and the backend share http://127.0.0.1:18302.
#
#   /                  the React app: the built bundle (E2E_APP_DIR mounted on
#                      /usr/share/nginx/html, nginx/app-dist.conf), or the Docker image of the
#                      app (E2E_APP_IMAGE, nginx/app-image.conf), included as app.conf
#   /.env.js           the runtime configuration of the app, docker/app-env.js
#   /appList.js        the apps of its app grid, docker/app-list.js
#   /jmap, /upload/, /download/, /eventSource, /.well-known/...   tmail-backend (JMAP + websocket)
#   /dex/              Dex, only when the `oidc` profile runs (502 otherwise)
#
# Same origin means no CORS at all in the browser. tmail-backend does answer CORS itself
# (Access-Control-Allow-Origin: *), so a cross origin setup works too, but it is not what
# the suite exercises by default.

# Upstreams are resolved per request: nginx boots even when Dex is not part of the stack.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    set $james "james:80";
    set $dex "dex:5556";
    # the app image, only with docker-compose.image.yaml (nginx/app-image.conf)
    set $app "app:8080";

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;

    location ~ ^/(jmap|upload|download|eventSource|publicAsset)(/|$) {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass http://$james$request_uri;
    }

    location /.well-known/ {
        proxy_pass http://$james$request_uri;
    }

    location /dex/ {
        proxy_pass http://$dex$request_uri;
    }

    # Runtime configuration of the app under test (docker/app-env.js), never the
    # one of the build
    location = /.env.js {
        alias /etc/nginx/e2e/app-env.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # No other Twake application to list in the app grid
    # A Twake Workplace container framing the app (APPGRID-02): open it as
    # http://localhost:<port>/e2e/workplace.html, another origin than the app
    # (127.0.0.1). nginx serves it, so Chromium sees a private address framing
    # a private address (local network access checks)
    location = /e2e/workplace.html {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html><html lang="en"><head><title>Twake Workplace</title></head><body style="margin:0"><iframe title="Twake Mail" style="width:100vw;height:100vh;border:0"></iframe><script>document.querySelector("iframe").src = location.protocol + "//127.0.0.1:" + location.port + "/"</script></body></html>';
    }

    # A fake Twake Drive (cozy-stack) for the Drive picker specs (DRIVE-*):
    # http://localhost:<port>/e2e/drive, another origin than the app, which
    # calls it with CORS as it calls the stack of a Workplace
    location = /e2e/drive/auth/token_exchange {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "content-type,authorization" always;
        add_header Access-Control-Allow-Methods "POST" always;
        if ($request_method = OPTIONS) { return 204; }
        default_type application/json;
        return 200 '{"token_type":"bearer","access_token":"e2e-drive-token"}';
    }
    location = /e2e/drive/intents {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "content-type,authorization" always;
        add_header Access-Control-Allow-Methods "POST" always;
        if ($request_method = OPTIONS) { return 204; }
        default_type application/json;
        return 200 '{"data":{"type":"io.cozy.intents","id":"e2e-intent","attributes":{"action":"PICK","type":"io.cozy.files","services":[{"href":"http://$http_host/e2e/drive/picker.html"}]}}}';
    }
    location = /e2e/drive/picker.html {
        alias /etc/nginx/e2e/drive-picker.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }
    location = /e2e/drive/files/report.txt {
        add_header Access-Control-Allow-Origin $http_origin always;
        default_type text/plain;
        return 200 'Quarterly report: ok';
    }

    # App grid of the app under test (docker/app-list.js, APPGRID-01)
    location = /appList.js {
        alias /etc/nginx/e2e/app-list.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Health probe used by start.sh and the Playwright globalSetup
    location = /__e2e/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The app under test: nginx/app-dist.conf or nginx/app-image.conf
    include /etc/nginx/e2e/app.conf;
}
