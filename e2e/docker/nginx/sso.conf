# Dex over HTTPS, on its own port (127.0.0.1:18303 by default, E2E_SSO_PORT): the SSO of the
# app must be served over HTTPS (@linagora/twake-oidc), as in production. The certificate is
# self-signed, generated by scripts/start.sh in .generated/; Playwright accepts it
# (ignoreHTTPSErrors). Another origin than the app: Dex answers CORS (allowedOrigins).
# Mounted next to default.conf or chart.conf, whichever the stack runs.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/e2e/sso.crt;
    ssl_certificate_key /etc/nginx/e2e/sso.key;

    # Resolved per request: nginx boots even when Dex is not part of the stack (502 then)
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $dex "dex:5556";

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /dex/ {
        proxy_pass http://$dex$request_uri;
    }

    # A fake Twake Workplace (cozy-stack) for the Drive picker specs (DRIVE-*), on this
    # origin, another one than the app: WORKPLACE_FQDN_FALLBACK of docker/app-env-oidc.js.
    # The app signs in to it (token exchange), the platform top bar reads it, the picker
    # creates its intent there and frames its page; the app calls it with CORS.
    location = /auth/token_exchange {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "accept,content-type,authorization" always;
        add_header Access-Control-Allow-Methods "GET,POST" always;
        if ($request_method = OPTIONS) { return 204; }
        default_type application/json;
        return 200 '{"token_type":"bearer","access_token":"e2e-drive-token","refresh_token":"e2e-drive-refresh","client_id":"e2e","client_secret":"e2e"}';
    }
    location = /apps/ {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "accept,content-type,authorization" always;
        add_header Access-Control-Allow-Methods "GET,POST" always;
        if ($request_method = OPTIONS) { return 204; }
        default_type application/json;
        return 200 '{"data":[{"id":"io.cozy.apps/drive","type":"io.cozy.apps","attributes":{"slug":"drive","name":"Drive","state":"ready"},"links":{"related":"https://$http_host/e2e/drive/"}}]}';
    }
    # The instance, its context and flags, as the platform top bar reads them
    location /settings/ {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "accept,content-type,authorization" always;
        add_header Access-Control-Allow-Methods "GET,POST" always;
        if ($request_method = OPTIONS) { return 204; }
        default_type application/json;
        return 200 '{"data":{"id":"e2e","type":"io.cozy.settings","attributes":{"email":"alice@example.com","public_name":"Alice"}}}';
    }
    location = /intents {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "accept,content-type,authorization" always;
        add_header Access-Control-Allow-Methods "GET,POST" always;
        if ($request_method = OPTIONS) { return 204; }
        default_type application/json;
        return 200 '{"data":{"type":"io.cozy.intents","id":"e2e-intent","attributes":{"action":"PICK","type":"io.cozy.files","services":[{"slug":"drive","href":"https://$http_host/e2e/drive/picker.html"}]}}}';
    }
    location = /e2e/drive/files/report.txt {
        add_header Access-Control-Allow-Origin $http_origin always;
        default_type text/plain;
        return 200 'Quarterly report: ok';
    }
    location = /e2e/drive/picker.html {
        alias /etc/nginx/e2e/drive-picker.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }
}
