<!doctype html>
<html lang="en" class="u-h-100">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The colour scheme before the app is loaded, so that the page never
      // flashes white: the copy of the `appearance.theme` setting of the
      // account kept in this browser (see ColorSchemeSync): dark, light (the
      // default), or `auto`, the one of the system. The app colours itself the same
      // way once loaded.
      ;(function () {
        var scheme = 'light'
        try {
          var preference = localStorage.getItem('twake-mail.preferences.theme')
          if (
            preference === 'dark' ||
            (preference === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            scheme = 'dark'
          }
        } catch (e) {
          // Storage disabled by the browser settings: light
        }
        var root = document.documentElement
        root.setAttribute('data-theme', scheme)
        root.style.colorScheme = scheme
        if (scheme === 'dark') {
          // background.default of the dark scheme of twake-mui (Grey A400)
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', '#2c3039')
        }
      })()
    </script>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="<%= assetPrefix %>/favicon.svg"
    />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/icons/Icon-192.png" />
    <link rel="manifest" href="<%= assetPrefix %>/manifest.json" />
    <link rel="stylesheet" href="<%= assetPrefix %>/fonts/fonts.css" />

    <title>Twake Mail</title>

    <!--
      Runtime configuration, loaded before the error handlers below so that a
      missing optional file is not mistaken for a failed bundle.
    -->
    <script src="<%= assetPrefix %>/.env.js"></script>
    <script src="<%= assetPrefix %>/version.js"></script>
    <script>
      // This catches the unexpected error while loading the JS bundle
      // and shows a friendly "Please refresh" UI instead of a white screen!
      var FALLBACK_I18N = {
        fr: {
          title: 'Twake Mail a été mis à jour',
          desc: 'Actualisez la page pour charger les dernières améliorations et continuer à travailler.',
          btn: 'Actualiser'
        },
        ru: {
          title: 'Twake Mail обновлён',
          desc: 'Обновите страницу, чтобы загрузить последние улучшения и продолжить работу.',
          btn: 'Обновить'
        },
        vi: {
          title: 'Twake Mail đã được cập nhật',
          desc: 'Làm mới trang để tải các cải tiến mới nhất và tiếp tục làm việc.',
          btn: 'Làm mới'
        },
        it: {
          title: 'Twake Mail è stato aggiornato',
          desc: 'Aggiorna la pagina per caricare gli ultimi miglioramenti e continuare a lavorare.',
          btn: 'Aggiorna'
        },
        de: {
          title: 'Twake Mail wurde aktualisiert',
          desc: 'Laden Sie die Seite neu, um die neuesten Verbesserungen zu laden und weiterzuarbeiten.',
          btn: 'Neu laden'
        },
        mn: {
          title: 'Twake Mail шинэчлэгдлээ',
          desc: 'Хамгийн сүүлийн сайжруулалтуудыг ачаалж, үргэлжлүүлэн ажиллахын тулд хуудсыг шинэчилнэ үү.',
          btn: 'Шинэчлэх'
        },
        es: {
          title: 'Twake Mail se ha actualizado',
          desc: 'Actualice la página para cargar las últimas mejoras y seguir trabajando.',
          btn: 'Actualizar'
        },
        en: {
          title: 'Twake Mail has been updated',
          desc: 'Refresh the page to load the latest improvements and continue working.',
          btn: 'Refresh'
        }
      }

      function showFallbackUI() {
        var lang = (localStorage.getItem('lang') || 'en').split('-')[0]
        var t = FALLBACK_I18N[lang] || FALLBACK_I18N['en']
        var errorUI =
          '<style>' +
          'body{margin:0}' +
          '.fallback-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#fafafa;padding:24px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}' +
          '.fallback-paper{background-color:#fff;border-radius:16px;padding:48px;text-align:center;max-width:420px;width:100%;box-sizing:border-box;box-shadow:0px 3px 3px -2px rgba(0,0,0,0.2),0px 3px 4px 0px rgba(0,0,0,0.14),0px 1px 8px 0px rgba(0,0,0,0.12)}' +
          '.fallback-icon{color:#F67E35;width:72px;height:72px;margin:0 auto 16px auto;display:flex;align-items:center;justify-content:center}' +
          '.fallback-icon svg{width:40px;height:40px;fill:currentColor}' +
          '.fallback-title{margin:0 0 16px 0;font-size:1.5rem;font-weight:600;color:rgba(0,0,0,0.87)}' +
          '.fallback-desc{margin:0 0 24px 0;font-size:1rem;color:rgba(0,0,0,0.6);line-height:1.5}' +
          '.fallback-btn{background-color:#F67E35;color:#fff;border:none;padding:8px 24px;font-size:0.875rem;font-weight:600;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0px 3px 1px -2px rgba(0,0,0,0.2),0px 2px 2px 0px rgba(0,0,0,0.14),0px 1px 5px 0px rgba(0,0,0,0.12)}' +
          '.fallback-btn:hover{background-color:#E55B31}' +
          '.fallback-btn svg{width:20px;height:20px;fill:currentColor}' +
          '</style>' +
          '<div class="fallback-container"><div class="fallback-paper">' +
          '<div class="fallback-icon"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"></path></svg></div>' +
          '<h1 class="fallback-title">' +
          t.title +
          '</h1>' +
          '<p class="fallback-desc">' +
          t.desc +
          '</p>' +
          '<button type="button" class="fallback-btn">' +
          '<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"></path></svg>' +
          t.btn +
          '</button>' +
          '</div></div>'
        document.body.innerHTML = errorUI
        // No inline event handler: the Content-Security-Policy of the image
        // only allows the inline scripts of this page, through their hashes
        document
          .querySelector('.fallback-btn')
          .addEventListener('click', function () {
            window.location.href = window.location.pathname
          })
      }

      window.addEventListener(
        'error',
        function (e) {
          // Catch syntax errors (Unexpected token '<')
          var isUnexpectedToken =
            e.message &&
            (e.message.includes("Unexpected token '<'") ||
              e.message.includes("expected expression, got '<'"))
          var isScriptError = e.filename && e.filename.indexOf('.js') > -1

          // Catch asset loading network failures (404s)
          var isNetworkError =
            e.target &&
            (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')
          if ((isUnexpectedToken && isScriptError) || isNetworkError) {
            showFallbackUI()
          }
        },
        true
      )

      window.addEventListener('unhandledrejection', function (e) {
        // AbortErrors are intentional (SSO redirect in progress, cancelled fetches)
        if (e.reason && e.reason.name === 'AbortError') return
        // Only intervene when React has not rendered anything — i.e. the
        // page still shows the boot shell (or nothing at all)
        var root = document.getElementById('root')
        var bootShell = document.getElementById('boot-shell')
        if (root && root.children.length > 0 && !bootShell) return
        showFallbackUI()
      })
    </script>
  </head>
  <body class="u-h-100">
    <noscript>You need to enable JavaScript to run Twake Mail.</noscript>
    <!--
      The boot shell: painted before the bundle is downloaded, so that a slow
      network shows a spinner and a status text instead of a blank page.
      React replaces it with its first render (createRoot clears #root). The
      colours follow the colour scheme the head script picked (color-scheme).
    -->
    <style>
      .boot-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 100%;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 1rem;
      }
      .boot-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(128, 128, 128, 0.3);
        border-top-color: currentColor;
        border-radius: 50%;
        box-sizing: border-box;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <div id="root" class="u-h-100">
      <div id="boot-shell" class="boot-shell" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span id="boot-text">Loading... Please wait!</span>
      </div>
    </div>
    <script>
      // The text of the boot shell in the language of the user (the one
      // chosen in this browser, else the one of the browser), and a hint to
      // check the connection when the bundle is still not there
      ;(function () {
        var BOOT_I18N = {
          en: {
            loading: 'Loading... Please wait!',
            slow: 'Still loading. Check your connection.'
          },
          fr: {
            loading: 'Chargement... Veuillez patienter !',
            slow: 'Chargement toujours en cours. Vérifiez votre connexion.'
          },
          ru: {
            loading: 'Загрузка... Подождите.',
            slow: 'Загрузка продолжается. Проверьте подключение.'
          },
          vi: {
            loading: 'Đang tiến hành ...',
            slow: 'Vẫn đang tải. Hãy kiểm tra kết nối của bạn.'
          },
          it: {
            loading: 'Caricamento… Attendere prego!',
            slow: 'Caricamento ancora in corso. Controlla la connessione.'
          },
          de: {
            loading: 'Lädt... Bitte warten!',
            slow: 'Wird noch geladen. Prüfen Sie Ihre Verbindung.'
          },
          mn: {
            loading: 'Ачааллаж байна... Түр хүлээнэ үү!',
            slow: 'Ачаалсаар байна. Холболтоо шалгана уу.'
          },
          es: {
            loading: 'Cargando… ¡Espere, por favor!',
            slow: 'Todavía cargando. Compruebe su conexión.'
          }
        }
        var SLOW_AFTER_MS = 8000

        function bootLanguage() {
          var candidates = []
          try {
            candidates.push(localStorage.getItem('lang'))
          } catch (e) {
            // Storage disabled by the browser settings
          }
          candidates = candidates.concat(
            navigator.languages || [navigator.language]
          )
          for (var i = 0; i < candidates.length; i++) {
            var tag = candidates[i]
            if (!tag) continue
            var primary = String(tag).toLowerCase().split(/[-_]/)[0]
            if (BOOT_I18N.hasOwnProperty(primary)) return primary
          }
          return 'en'
        }

        var text = document.getElementById('boot-text')
        if (!text) return
        var lang = bootLanguage()
        var messages = BOOT_I18N[lang]
        text.setAttribute('lang', lang)
        text.textContent = messages.loading
        setTimeout(function () {
          // Gone once React has rendered
          if (text.isConnected) text.textContent = messages.slow
        }, SLOW_AFTER_MS)
      })()
    </script>
  </body>
</html>
